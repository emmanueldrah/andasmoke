name: Publish desktop auto-update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop-auto-release.yml
      - api/**
      - electron/**
      - public/**
      - scripts/build-api.mjs
      - server-api/**
      - src/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assign unique update version
        shell: pwsh
        run: |
          $patch = ([int]$env:GITHUB_RUN_NUMBER * 100) + [int]$env:GITHUB_RUN_ATTEMPT
          npm version "1.1.$patch" --no-git-tag-version

      - name: Build app
        run: npm run build

      - name: Publish Windows update
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}