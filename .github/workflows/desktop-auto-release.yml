name: Publish desktop auto-update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop-auto-release.yml
      - api/**
      - electron/**
      - public/**
      - scripts/**
      - server-api/**
      - src/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assign unique update version
        shell: pwsh
        run: |
          $patch = ([int]$env:GITHUB_RUN_NUMBER * 100) + [int]$env:GITHUB_RUN_ATTEMPT
          npm version "1.1.$patch" --no-git-tag-version

      - name: Package and publish the Windows update
        shell: pwsh
        run: node scripts/publish-desktop.mjs
        env:
          ANDAPOS_UPDATE_URL: https://andasmoke.vercel.app/updates/win
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the update manifest so Vercel serves it
        shell: pwsh
        run: |
          git config user.name "Anda Updates"
          git config user.email "updates@andasmoke.local"
          git add public/updates/win/latest.yml
          if (git diff --cached --quiet) {
            Write-Host "Manifest unchanged; nothing to commit."
            exit 0
          }
          git commit -m "chore: desktop update manifest [skip ci]"
          git push